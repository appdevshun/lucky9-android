plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lucky9.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lucky9.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.0.2-probe"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas".toString(),
                    "room.incremental"   : "true",
                ]
            }
        }
    }

    def localProps = new Properties()
    def localFile = rootProject.file('local.properties')
    if (localFile.exists()) {
        localProps.load(new FileInputStream(localFile))
    }
    def storeFilePath = localProps.getProperty('LUCKY9_STORE_FILE') ?: System.getenv('LUCKY9_STORE_FILE')
    def storePass = localProps.getProperty('LUCKY9_STORE_PASS') ?: System.getenv('LUCKY9_STORE_PASS')
    def keyAliasName = localProps.getProperty('LUCKY9_KEY_ALIAS') ?: System.getenv('LUCKY9_KEY_ALIAS')
    def keyPass = localProps.getProperty('LUCKY9_KEY_PASS') ?: System.getenv('LUCKY9_KEY_PASS')

    signingConfigs {
        if (storeFilePath && storePass && keyAliasName && keyPass) {
            release {
                storeFile file(storeFilePath)
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // default debug signing
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Lifecycle / LiveData
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'

    // OkHttp for online relay (stub)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
